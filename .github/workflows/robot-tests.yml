name: Robot Framework Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/robot/**'
      - 'backend/go-api/**'

jobs:
  robot:
    runs-on: ubuntu-latest
    services:
      anvil:
        image: ghcr.io/foundry-rs/foundry
        ports:
          - 8545:8545
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install robotframework robotframework-requests robotframework-jsonlibrary robotframework-pabot web3

      - name: Run Robot Framework tests
        run: |
          pabot --processes 4 --outputdir results tests/robot/

      - uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: results/
